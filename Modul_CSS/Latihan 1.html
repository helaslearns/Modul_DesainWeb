<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin & Padding</title>
    <style>
        .satu{
            border: 1px solid black;
            background-color: lightblue;
            margin: 40px 50px 60px 30px;
        }
        .dua{
            border: 1px solid black;
            background-color: lightblue;
            padding-top: 40px;
            padding-right: 40px;
            padding-bottom: 40px;
            padding-left: 40px;
        }
    </style>
</head>
<body>
    <div class="satu">
        Partisi ini memiliki margin atas 40px, kanan 50px, bawah 60px, dan
        kiri 30px.
    </div>

    <div class="dua">
        Sedangkan yang ini memiliki padding atas, kanan, bawah, dan kiri 40px.
    </div>
</body>
</html>
